<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrossWatch</title>
<style>
:root{color-scheme:light dark;font:13px -apple-system,BlinkMacSystemFont,sans-serif}body{margin:16px;background:transparent}h1{font-size:18px;margin:0 0 12px}h2{font-size:13px;margin-top:22px}p{line-height:1.5;overflow-wrap:anywhere}label{display:block;margin:10px 0 4px}input,select,button{font:inherit;box-sizing:border-box;padding:7px;border:1px solid #8886;border-radius:6px}input,select{width:100%}button{cursor:pointer;margin:5px 4px 5px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #489aff}#status{padding:10px;background:#8882;border-radius:8px}.row{display:flex;gap:10px}.row>div{flex:1}small,.muted{opacity:.7}.result{display:block;width:100%;text-align:left}.result small{display:block;margin-top:4px}#current{font-weight:600}details{margin-top:18px}summary{cursor:pointer}
</style></head><body>
<h1>CrossWatch</h1><p id="status" role="status" aria-live="polite">Connecting to IINA…</p>
<p id="current"></p><p id="file" class="muted"></p>
<button id="check">Check connection</button><button id="retry">Retry pending</button><button id="skip">Stop tracking</button>
<h2>Identify this video</h2>
<label for="query">Title</label><input id="query" placeholder="Movie or series title">
<div class="row"><div><label for="type">Type</label><select id="type"><option value="movie">Movie</option><option value="show">Episode</option></select></div><div><label for="year">Year</label><input id="year" type="number" min="1888" max="2100"></div></div>
<div class="row"><div><label for="season">Season</label><input id="season" type="number" min="0"></div><div><label for="episode">Episode</label><input id="episode" type="number" min="1"></div></div>
<button id="search">Search CrossWatch</button><div id="results"></div>
<details><summary>Enter an ID manually</summary><label for="id">TMDb number or IMDb ID</label><input id="id" placeholder="603 or tt0133093"><p class="muted">For episodes, use the series ID and enter the season and episode above.</p><button id="manual">Use this ID</button></details>
<script>
const $ = id => document.getElementById(id);
let lastFile = null, lastResults = '';
function fields(){return {type:$('type').value,year:$('year').value,season:$('season').value,episode:$('episode').value};}
iina.onMessage('state', state => {
  $('status').textContent = state.status;
  $('file').textContent = state.file;
  $('current').textContent = state.media ? state.media.title + (state.media.type === 'episode' ? ' · S' + state.media.season + ' E' + state.media.episode : '') + ' · ' + state.progress + '%' : '';
  if(state.file !== lastFile){
    lastFile = state.file;
    const p=state.parsed || {};
    $('query').value=p.title || ''; $('type').value=p.type || 'movie'; $('year').value=p.year || '';
    $('season').value=p.season == null ? '' : p.season; $('episode').value=p.episode == null ? '' : p.episode;
  }
  const serialized = JSON.stringify(state.results);
  if(serialized !== lastResults){
    lastResults = serialized; $('results').replaceChildren();
    state.results.forEach((item,index)=>{
      const button=document.createElement('button');button.className='result';
      button.textContent=item.title + (item.year ? ' ('+item.year+')' : '');
      const detail=document.createElement('small');detail.textContent=item.overview || 'TMDb '+item.tmdb;button.appendChild(detail);
      button.onclick=()=>iina.postMessage('select',Object.assign(fields(),{index}));$('results').appendChild(button);
    });
  }
});
['check','retry','skip'].forEach(id => $(id).onclick=()=>iina.postMessage(id));
$('search').onclick=()=>iina.postMessage('search',Object.assign(fields(),{query:$('query').value}));
$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click();};
$('manual').onclick=()=>iina.postMessage('manual',Object.assign(fields(),{id:$('id').value,title:$('query').value}));
iina.postMessage('ready');
</script></body></html>
